name: Amphetamine
options:
  bundleIdPrefix: com.amphetamine
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true

targets:
  Amphetamine:
    type: application
    platform: macOS
    sources:
      - Amphetamine
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.amphetamine.app
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: Amphetamine/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.9"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
